name: ci
on:
  pull_request:
  push:
    branches: [main, 'windows/**', 'android/**', 'admin/**', 'server/**', 'lead/**', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: scope
        if: github.event_name == 'pull_request'
        run: scripts/check-scope.sh origin/${{ github.base_ref }}
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest pyyaml jsonschema openapi-spec-validator
      - run: pytest -q tests/contract
  windows-dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        shell: bash
        run: echo "code=$(ls windows/*.sln admin/*.sln windows/**/*.csproj admin/**/*.csproj 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.code == ''
        run: echo "无 .NET 代码，跳过"
      - if: steps.has.outputs.code != ''
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - if: steps.has.outputs.code != ''
        shell: bash
        run: |
          for d in windows admin; do [ -d "$d" ] && (cd "$d" && dotnet restore && dotnet build -c Release --no-restore && dotnet test -c Release --no-build); done
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "code=$([ -f android/gradlew ] && echo y)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.code == ''
        run: echo "无 Android 代码，跳过"
      - if: steps.has.outputs.code != ''
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - if: steps.has.outputs.code != ''
        uses: gradle/actions/setup-gradle@v4
      - if: steps.has.outputs.code != ''
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lint
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "code=$([ -d server ] && ls server/*.py server/**/*.py 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.code == ''
        run: echo "无 Python 代码，跳过"
      - if: steps.has.outputs.code != ''
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: steps.has.outputs.code != ''
        working-directory: server
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pyyaml jsonschema ruff
          ruff check .
          pytest -q
      - if: steps.has.outputs.code != '' && hashFiles('tests/server/server-core/test_server_core.py') != ''
        env:
          OSAKA_SERVER_CMD: python3 -m osaka_server.app
          OSAKA_INVITE_FN: osaka_server.invite.is_valid_invite_code
          PYTHONPATH: server
        run: pytest tests/server/server-core -q -rs
  a10-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('tests/admin/admin-connect/run-a10.sh') == ''
        run: echo "无 A10 脚本，跳过"
      - if: hashFiles('tests/admin/admin-connect/run-a10.sh') != ''
        run: bash tests/admin/admin-connect/run-a10.sh
