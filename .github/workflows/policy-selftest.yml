# 改检查器脚本的提案 PR 上，拿固定样例跑候选脚本。改本文件算权限类（Hao Yin 档②）。
# prepare 只有 contents:read，只把候选脚本存成 artifact；policy-selftest 没有任何权限、不用 secrets，只跑脚本自带的测试。
# 托管 runner 默认能联网（Hao Yin 已接受）。check 名字 policy-selftest 由 gate-summary 核对。
name: policy-selftest
on:
  pull_request:
    branches: [main]
    paths: ["policy-proposals/scripts/**"]
permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false, sparse-checkout: policy-proposals/scripts}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {name: candidate, path: policy-proposals/scripts/}
  policy-selftest:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: {name: candidate, path: scripts}
      - run: cd scripts && python3 -m unittest -v test_gate
